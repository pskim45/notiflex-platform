name: CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  REGION: asia-northeast3
  REPOSITORY: notiflex
  IMAGE_NAME: api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE_NAME}:sha-${SHORT_SHA}"
          docker build --tag "${IMAGE}" app/
          docker push "${IMAGE}"
          echo "IMAGE_URI=${IMAGE}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"
          echo "Published ${IMAGE}"

      - name: Update rollout manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IMAGE_URI}"
          echo "Updating manifest to ${IMAGE_URI}"
          sed -i -E "s#^([[:space:]]*image: ).*/notiflex/api:[^[:space:]]+#\1${IMAGE_URI}#" k8s/smb/rollout.yaml k8s/enterprise/rollout.yaml
          grep -F "image: ${IMAGE_URI}" k8s/smb/rollout.yaml
          grep -F "image: ${IMAGE_URI}" k8s/enterprise/rollout.yaml
          git diff --check
          if git diff --exit-code --quiet -- k8s/smb/rollout.yaml k8s/enterprise/rollout.yaml; then
            echo "Manifest already references ${IMAGE_URI}"
            exit 0
          fi

      - name: Commit deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --exit-code --quiet -- k8s/smb/rollout.yaml k8s/enterprise/rollout.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/smb/rollout.yaml k8s/enterprise/rollout.yaml
          git commit -m "ci: deploy sha-${SHORT_SHA} [skip ci]"
          git push origin HEAD:main
