prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 0
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

grafana:
  admin:
    existingSecret: kube-prometheus-grafana
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 0
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 0
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 0
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 0
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 0
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# GKE 관리형 control plane은 아래 scrape endpoint를 노출하지 않는다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
