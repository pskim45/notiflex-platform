apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: enterprise
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "10"
    services: "5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-reader
  namespace: enterprise
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-reader
  namespace: enterprise
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-reader
  namespace: enterprise
subjects:
  - kind: ServiceAccount
    name: tenant-reader
    namespace: enterprise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-reader
