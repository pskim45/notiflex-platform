apiVersion: v1
kind: ConfigMap
metadata:
  name: notiflex-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  notiflex.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "cores"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"notiflex\",pod=~\"notiflex-api-.*\",container=\"api\"}[5m])) by (pod)", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Notiflex Pod CPU",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"notiflex\",pod=~\"notiflex-api-.*\",container=\"api\"}) by (pod)", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Notiflex Pod Memory",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "sum(kube_pod_container_status_restarts_total{namespace=\"notiflex\",pod=~\"notiflex-api-.*\"}) by (pod)", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Notiflex Pod Restarts",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Notiflex가 /metrics에서 http_requests_total을 노출하면 요청량이 표시됩니다.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"notiflex\"}[5m]))", "legendFormat": "requests/s", "refId": "A"}],
          "title": "Notiflex HTTP Requests",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["notiflex", "kubernetes"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "Notiflex Overview",
      "uid": "notiflex-overview",
      "version": 1
    }
